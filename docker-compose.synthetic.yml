services:
  fixture-site:
    build: .
    command: ["node", "src/fixture-site.ts"]
    environment:
      FIXTURE_BIND: 0.0.0.0
      FIXTURE_PORT: "8080"
    expose:
      - "8080"
    networks:
      - vfdiag

  worker:
    environment:
      VFDIAG_SYNTHETIC_HOSTS: fixture-site
    depends_on:
      fixture-site:
        condition: service_started
