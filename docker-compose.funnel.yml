services:
  worker:
    environment:
      VFDIAG_SERVICE_TOKEN: ${VFDIAG_SERVICE_TOKEN:?set VFDIAG_SERVICE_TOKEN in .env}
      VFDIAG_FUNNEL: "1"
      VFDIAG_EGRESS_FILTER: "1"
      VFDIAG_EGRESS_ALLOW: "172.16.50.0/24"
      VFDIAG_QWEN_API_KEY: ${VFDIAG_QWEN_API_KEY:-}
      VFDIAG_QWEN_BASE_URL: ${VFDIAG_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VFDIAG_PRINT_ORIGIN: ${VFDIAG_PRINT_ORIGIN:-}
      VFDIAG_RENDER_TOKEN: ${VFDIAG_RENDER_TOKEN:-}
    cap_add:
      - NET_ADMIN
