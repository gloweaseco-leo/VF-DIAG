name: vf-diag

services:
  worker:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      VFDIAG_SERVICE_TOKEN: ${VFDIAG_SERVICE_TOKEN:-local-docker-dev-token-change-me}
      VFDIAG_SYNTHETIC_HOSTS: ""
    volumes:
      - vfdiag-data:/var/lib/vfdiag
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  vfdiag-data:
