name: test

on:
  pull_request:
  push:
    branches: [main, m1/synthetic-report-worker]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run worker tests
        run: node --experimental-strip-types --test --test-reporter=spec test/*.ts
